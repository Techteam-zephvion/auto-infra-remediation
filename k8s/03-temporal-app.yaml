apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: auto-remediation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
    spec:
      containers:
      - name: temporal
        image: temporalio/auto-setup:1.22.4
        env:
        - name: DB
          value: "postgresql"
        - name: DB_PORT
          value: "5432"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: auto-remediation-secrets
              key: postgres-user
        - name: POSTGRES_PWD
          valueFrom:
            secretKeyRef:
              name: auto-remediation-secrets
              key: postgres-password
        - name: POSTGRES_SEEDS
          value: "postgres"
        ports:
        - containerPort: 7233
        livenessProbe:
          exec:
            command:
              - tctl
              - --address
              - temporal:7233
              - workflow
              - list
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
              - tctl
              - --address
              - temporal:7233
              - workflow
              - list
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: auto-remediation
spec:
  selector:
    app: temporal
  ports:
  - port: 7233
    targetPort: 7233
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-remediation
  namespace: auto-remediation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auto-remediation
  template:
    metadata:
      labels:
        app: auto-remediation
    spec:
      serviceAccountName: auto-remediation-sa
      containers:
      - name: auto-remediation
        image: auto-remediation:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: auto-remediation-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auto-remediation-secrets
              key: postgres-password
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: auto-remediation-config
              key: POSTGRES_DB
        envFrom:
        - configMapRef:
            name: auto-remediation-config
        ports:
        - containerPort: 8001
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auto-remediation-service
  namespace: auto-remediation
spec:
  selector:
    app: auto-remediation
  ports:
  - port: 80
    targetPort: 8001
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auto-remediation-ingress
  namespace: auto-remediation
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # Optional: for HTTPS
spec:
  rules:
  - host: auto-remediation.your-domain.com  # Update this
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auto-remediation-service
            port:
              number: 80