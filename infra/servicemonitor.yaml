# ── ServiceMonitor ───────────────────────────────────────────────────────────
# Configures Prometheus Operator to scrape metrics from the webhook
# Requires: kube-prometheus-stack (Prometheus Operator) installed
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auto-remediation-webhook
  namespace: default
  labels:
    app: auto-remediation-webhook
    release: prometheus  # Must match Prometheus Operator release label
spec:
  # Select the service to monitor
  selector:
    matchLabels:
      app: auto-remediation-webhook
  
  # Define how to scrape metrics
  endpoints:
  - port: http  # Matches the port name in the Service
    path: /metrics
    interval: 30s  # Scrape every 30 seconds
    scrapeTimeout: 10s
    scheme: http
    
    # Relabel metrics to add useful labels
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node

---
# ── PrometheusRule ───────────────────────────────────────────────────────────
# Define alerting rules based on remediation metrics
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: auto-remediation-alerts
  namespace: default
  labels:
    app: auto-remediation-webhook
    release: prometheus
spec:
  groups:
  - name: auto-remediation.rules
    interval: 30s
    rules:
    
    # Alert when safety validation denial rate is high
    - alert: HighSafetyValidationDenialRate
      expr: |
        rate(safety_validation_denials_total[5m]) > 0.5
      for: 5m
      labels:
        severity: warning
        component: auto-remediation
      annotations:
        summary: "High rate of safety validation denials"
        description: "More than 0.5 scripts per second are being denied by safety validation. This may indicate malicious alerts or misconfigured LLM prompts."
    
    # Alert when workflow execution failures are high
    - alert: HighRemediationFailureRate
      expr: |
        rate(remediation_execution_failures_total[10m]) > 0.3
      for: 10m
      labels:
        severity: critical
        component: auto-remediation
      annotations:
        summary: "High rate of remediation execution failures"
        description: "More than 0.3 remediation workflows per second are failing. Check logs and LLM connectivity."
    
    # Alert when workflow duration is too long
    - alert: SlowRemediationWorkflows
      expr: |
        histogram_quantile(0.95, rate(remediation_duration_seconds_bucket[5m])) > 60
      for: 10m
      labels:
        severity: warning
        component: auto-remediation
      annotations:
        summary: "Remediation workflows are taking too long"
        description: "95th percentile workflow duration is {{ $value }}s (threshold: 60s). LLM may be slow or overloaded."
    
    # Alert when there are no workflows (service might be down)
    - alert: NoRemediationWorkflows
      expr: |
        rate(remediation_workflows_total[30m]) == 0
      for: 30m
      labels:
        severity: info
        component: auto-remediation
      annotations:
        summary: "No remediation workflows in last 30 minutes"
        description: "No alerts have been processed. This is normal if there are no infrastructure issues, but verify AlertManager is configured correctly."

---
# ── Usage Instructions ───────────────────────────────────────────────────────
# Prerequisites:
#   1. kube-prometheus-stack must be installed with Prometheus Operator
#   2. Prometheus must have the 'release: prometheus' label (default)
#   3. Webhook service must be deployed and running
#
# Apply:
#   kubectl apply -f infra/servicemonitor.yaml
#
# Verify:
#   # Check if ServiceMonitor is created
#   kubectl get servicemonitor auto-remediation-webhook -n default
#
#   # Check Prometheus targets (should see auto-remediation-webhook)
#   kubectl port-forward -n monitoring svc/prometheus-kube-prometheus-prometheus 9090:9090
#   # Open http://localhost:9090/targets in browser
#
#   # Query metrics in Prometheus
#   # Open http://localhost:9090/graph
#   # Try queries:
#   #   - remediation_workflows_total
#   #   - rate(remediation_duration_seconds_sum[5m]) / rate(remediation_duration_seconds_count[5m])
#   #   - histogram_quantile(0.95, rate(remediation_duration_seconds_bucket[5m]))
#
# Grafana Dashboard Queries:
#   - Total Workflows: sum(remediation_workflows_total)
#   - Avg Duration: rate(remediation_duration_seconds_sum[5m]) / rate(remediation_duration_seconds_count[5m])
#   - Success Rate: rate(remediation_workflows_total{status="completed"}[5m]) / rate(remediation_workflows_total[5m])
#   - Denial Rate: rate(safety_validation_denials_total[5m])
#   - Active Workflows: remediation_active_workflows
#
# Troubleshooting:
#   - If no targets appear: Check that labels match between ServiceMonitor and Service
#   - If scrape fails: Verify /metrics endpoint is accessible from Prometheus pod
#   - Check Prometheus logs: kubectl logs -n monitoring -l app.kubernetes.io/name=prometheus
