apiVersion: v1
kind: Namespace
metadata:
  name: auto-remediation
---
apiVersion: v1
kind: Secret
metadata:
  name: auto-remediation-secrets
  namespace: auto-remediation
type: Opaque
data:
  # Base64 encoded values - update these
  postgres-password: c2VjdXJlX3Bhc3N3b3JkX2NoYW5nZV9tZQ== # secure_password_change_me
  postgres-user: YXV0b3JlbWVkaWF0aW9u # autoremediation
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auto-remediation-config
  namespace: auto-remediation
data:
  POSTGRES_DB: "auto_remediation"
  TEMPORAL_HOST: "temporal:7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TASK_QUEUE: "auto-remediation-queue"
  TEMPORAL_ENABLED: "true"
  REDIS_URL: "redis://redis:6379/0"
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_MODEL: "llama3.1:8b"
  OLLAMA_TIMEOUT: "30"
  OTEL_ENABLED: "false"
  PROMETHEUS_ENABLED: "true"
  ENVIRONMENT: "production"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: auto-remediation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: auto-remediation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard